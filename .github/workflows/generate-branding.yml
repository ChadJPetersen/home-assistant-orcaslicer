name: Generate OrcaSlicer Home Assistant branding

on:
  push:
    branches: [main]
    paths:
      - ".github/branding/**"
      - "scripts/generate_branding.py"
      - ".github/workflows/generate-branding.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: orcaslicer-home-assistant-branding
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install renderer
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0 CairoSVG==2.8.2
      - name: Render Home Assistant icon and logo from official SVG
        run: python scripts/generate_branding.py
      - name: Check generated PNG files
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          for name, size in (("icon.png", (128, 128)), ("logo.png", (250, 100))):
              f=Path("orcaslicer")/name
              with Image.open(f) as image:
                  assert image.format=="PNG" and image.size==size
                  image.verify()
              print(f"Validated {f}: {size}")
          PY
      - name: Commit generated artwork when changed
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add orcaslicer/icon.png orcaslicer/logo.png
          if git diff --cached --quiet; then
            echo "Branding is up to date"
            exit 0
          fi
          git commit -m "docs: add official OrcaSlicer icon and logo to Home Assistant app"
          git push
