configuration:
  PUID:
    name: Container user ID
    description: >-
      LinuxServer.io user ID for the OrcaSlicer process. The upstream Selkies
      default is 911. Change this only if you have a specific permissions need.
  PGID:
    name: Container group ID
    description: >-
      LinuxServer.io group ID for the OrcaSlicer process. The upstream Selkies
      default is 911. Change this only if you have a specific permissions need.
  PIXELFLUX_WAYLAND:
    name: Use Wayland
    description: >-
      Run the streamed desktop using Wayland. Set to false to use the X11 stack
      if Wayland causes rendering or compatibility problems.
  SELKIES_FRAMERATE:
    name: Initial stream frame rate
    description: >-
      Initial Selkies browser-stream frame rate. This affects the web desktop,
      not slicing speed.
  SELKIES_VIDEO_CRF:
    name: Stream quality (CRF)
    description: >-
      Initial video CRF for the Selkies stream. Lower values give higher visual
      quality and use more bandwidth. LinuxServer's default is 25.
