name: "OrcaSlicer"
version: "v2.4.2-ls42"
slug: "orcaslicer"
description: >-
  Web-accessible OrcaSlicer using the official LinuxServer.io container,
  with Home Assistant Ingress and upstream release tracking.
url: "https://github.com/ChadJPetersen/home-assistant-orcaslicer"

arch:
  - amd64
  - aarch64

image: "lscr.io/linuxserver/orcaslicer"
# LinuxServer's image does not contain Home Assistant io.hass labels.
# Legacy mode tells Supervisor to use this config.yaml as the app metadata.
# It also maps scalar Home Assistant options into container environment variables,
# which lets the Configuration tab control LinuxServer/Selkies settings directly.
legacy: true
init: false

stage: experimental
timeout: 300

ingress: true
ingress_port: 3000
ingress_stream: true
panel_icon: "mdi:printer-3d-nozzle"
panel_title: "OrcaSlicer"

# LinuxServer recommends a large /dev/shm for Selkies-based GUI containers.
# Home Assistant Apps do not expose Docker's shm_size setting, so sharing the
# host IPC namespace avoids Docker's small default shared-memory allocation.
host_ipc: true

map:
  - type: data
    read_only: false
    path: /config
  - type: share
    read_only: false
    path: /share

# Fixed environment settings. User-adjustable scalar settings are under
# options/schema below; legacy mode passes those options into the container
# using the same names as environment variables.
environment:
  TITLE: "OrcaSlicer"
  START_DOCKER: "false"
  HARDEN_DESKTOP: "true"
  SELKIES_FILE_TRANSFERS: "upload,download"
  SELKIES_FILE_MANAGER_PATH: "/config/Desktop"
  SELKIES_AUDIO_ENABLED: "false|locked"
  NO_GAMEPAD: "true"
  NO_WEBCAM: "true"
  NO_STEAM: "true"
  DISABLE_IPV6: "true"

options:
  PUID: 911
  PGID: 911
  PIXELFLUX_WAYLAND: "false"
  SELKIES_FRAMERATE: 60
  SELKIES_VIDEO_CRF: 25

schema:
  PUID: int(0,65535)
  PGID: int(0,65535)
  PIXELFLUX_WAYLAND: list(true|false)
  SELKIES_FRAMERATE: int(8,240)
  SELKIES_VIDEO_CRF: int(5,50)

backup: cold
